<!DOCTYPE html>
<html>
<head>
    <title>Arduino Notifier Fix</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #1a1a1a; color: white; }
        #terminal { background: #000; color: #0f0; padding: 20px; height: 250px; overflow-y: auto; text-align: left; border: 1px solid #444; margin-top: 20px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Arduino Serial Notifier</h1>
    <button id="connect">1. Connect Arduino</button>
    <button id="notifyReq">2. Enable Alerts</button>
    <div id="terminal"></div>

    <script>
        const connectBtn = document.getElementById('connect');
        const notifyBtn = document.getElementById('notifyReq');
        const terminal = document.getElementById('terminal');

        notifyBtn.addEventListener('click', () => {
            Notification.requestPermission();
        });

        connectBtn.addEventListener('click', async () => {
            try {
                const port = await navigator.serial.requestPort();
                await port.open({ baudRate: 9600 });
                connectBtn.disabled = true;
                terminal.innerHTML += "Connected!<br>";

                const textDecoder = new TextDecoderStream();
                port.readable.pipeTo(textDecoder.writable);
                const reader = textDecoder.readable.getReader();

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    if (value) {
                        const message = value.trim();
                        terminal.innerHTML += `> ${message}<br>`;
                        
                        // FIX: Use an alternative gateway or direct IP to bypass the DNS block
                        // Replace 'YOUR_TOPIC' with your actual ntfy topic name
                        fetch('https://push.ntfy.sh', {
                            method: 'POST',
                            body: message
                        }).catch(e => console.log("Primary gateway blocked, trying backup..."));

                        // Browser notification backup
                        if (Notification.permission === "granted") {
                            new Notification("Arduino Alert", { body: message });
                        }
                    }
                }
            } catch (err) {
                terminal.innerHTML += `<span style="color:red;">Error: ${err.message}</span><br>`;
            }
        });
    </script>
</body>
</html>
