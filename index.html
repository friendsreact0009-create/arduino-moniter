<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Serial Monitor & Notifier 2026 By Brayden</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #e0e0e0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .panel { background: #1e1e1e; padding: 20px; border-radius: 10px; width: 100%; max-width: 600px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); margin-bottom: 20px; }
        input, button { padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #444; width: 100%; box-sizing: border-box; }
        input { background: #2c2c2c; color: white; }
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        #terminal { background: #000; color: #00ff00; height: 250px; overflow-y: auto; padding: 10px; font-family: monospace; border: 1px solid #333; margin-top: 10px; text-align: left; }
        .flex-row { display: flex; gap: 10px; }
    </style>
</head>
<body>

    <div class="panel">
        <h3>1. NTFY Configuration</h3>
        <input type="text" id="topic" placeholder="ntfy Topic Name">
        <input type="password" id="token" placeholder="Access Token (tk_...)">
    </div>

    <div class="panel">
        <h3>2. Connection & Commands</h3>
        <button id="connectBtn">Connect Arduino</button>
        <div class="flex-row" style="margin-top: 10px;">
            <input type="text" id="commandInput" placeholder="Type a command to Arduino...">
            <button id="sendBtn" style="width: 100px;">Send</button>
        </div>
        <div id="terminal">System: Waiting for connection...</div>
    </div>

    <script>
        let port, writer;
        const terminal = document.getElementById('terminal');
        const connectBtn = document.getElementById('connectBtn');

        function log(msg, color = "#00ff00") {
            terminal.innerHTML += `<div style="color:${color}">> ${msg}</div>`;
            terminal.scrollTop = terminal.scrollHeight;
        }

        async function sendToNtfy(msg) {
            const topic = document.getElementById('topic').value.trim();
            const token = document.getElementById('token').value.trim();
            if (!topic) return;

            const url = `https://139.144.135.197{topic}`;
            const headers = { 'Title': 'Arduino Data' };
            if (token) headers['Authorization'] = `Bearer ${token}`;

            try {
                await fetch(url, { method: 'POST', body: msg, headers: headers });
            } catch (err) {
                console.error("Ntfy Error (Check IP whitelist):", err);
            }
        }

        // Send data TO Arduino
        document.getElementById('sendBtn').onclick = async () => {
            const cmd = document.getElementById('commandInput').value;
            if (!writer) return log("Error: Not connected!", "red");
            
            const encoder = new TextEncoder();
            await writer.write(encoder.encode(cmd + "\n"));
            log(`Sent to Arduino: ${cmd}`, "cyan");
            document.getElementById('commandInput').value = "";
        };

        // Connect and Read FROM Arduino
        connectBtn.onclick = async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 9600 });
                connectBtn.disabled = true;
                log("CONNECTED", "white");

                // Setup Writer for sending commands
                writer = port.writable.getWriter();

                // Setup Reader for receiving data
                const textDecoder = new TextDecoderStream();
                port.readable.pipeTo(textDecoder.writable);
                const reader = textDecoder.readable.getReader();

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    if (value) {
                        const cleanMsg = value.trim();
                        log(cleanMsg);
                        
                        // If Arduino sends "ALERT", trigger ntfy
                        if (cleanMsg.includes("ALERT")) {
                            sendToNtfy(cleanMsg);
                        }
                    }
                }
            } catch (err) {
                log(`Error: ${err.message}`, "red");
            }
        };
    </script>
</body>
</html>
