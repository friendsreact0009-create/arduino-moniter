<!DOCTYPE html>
<html>
<head>
    <title>Arduino Notifier - IP Fix</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #1a1a1a; color: white; }
        .config-box { background: #2a2a2a; padding: 15px; border-radius: 8px; margin: 10px auto; width: 300px; text-align: left; }
        input { width: 90%; padding: 8px; margin: 5px 0; background: #333; color: white; border: 1px solid #555; }
        #terminal { background: #000; color: #0f0; padding: 15px; height: 200px; overflow-y: auto; text-align: left; font-family: monospace; margin-top: 15px; }
        button { padding: 10px; margin: 5px; cursor: pointer; border-radius: 4px; border: none; background: #007bff; color: white; }
    </style>
</head>
<body>
    <h2>Arduino Serial Notifier</h2>
    
    <div class="config-box">
        Topic:<br>
        <input type="text" id="ntfyTopic" placeholder="topic_name"><br>
        Access Token (Key):<br>
        <input type="password" id="ntfyToken" placeholder="tk_xxxxxxxxxxxx">
    </div>

    <button id="connect">Connect Arduino</button>
    <div id="terminal">Waiting...</div>

    <script>
        const terminal = document.getElementById('terminal');

        document.getElementById('connect').addEventListener('click', async () => {
            const topic = document.getElementById('ntfyTopic').value;
            const token = document.getElementById('ntfyToken').value;

            try {
                const port = await navigator.serial.requestPort();
                await port.open({ baudRate: 9600 });
                terminal.innerHTML = "CONNECTED<br>";

                const textDecoder = new TextDecoderStream();
                port.readable.pipeTo(textDecoder.writable);
                const reader = textDecoder.readable.getReader();

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    if (value) {
                        const message = value.trim();
                        terminal.innerHTML += `> ${message}<br>`;

                        // IP BYPASS: Using direct IP 139.144.135.197 to fix ERR_NAME_NOT_RESOLVED
                        const headers = { 'Title': 'Arduino Data' };
                        if (token) headers['Authorization'] = `Bearer ${token}`;

                        fetch(`https://139.144.135.197{topic}`, {
                            method: 'POST',
                            body: message,
                            headers: headers
                        }).catch(e => terminal.innerHTML += `<span style="color:orange;">Ntfy Error: ${e.message}</span><br>`);
                    }
                }
            } catch (err) {
                terminal.innerHTML += `<span style="color:red;">Serial Error: ${err.message}</span><br>`;
            }
        });
    </script>
</body>
</html>
